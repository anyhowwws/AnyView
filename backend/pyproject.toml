[project]
name = "anyview"
version = "0.0.1"
description = "AnyView API — interview prep with a second brain"
requires-python = ">=3.12"
# Every dependency is justified. Add one, add a line.
dependencies = [
  # Web framework. Small, async, typed request/response models; StreamingResponse is our SSE transport (ADR 0005).
  "fastapi>=0.115",
  # ASGI server that runs FastAPI. Cloud Run needs a process listening on $PORT; this is it.
  "uvicorn[standard]>=0.30",
  # Official Google Gen AI SDK; its Vertex client is the only model access path (ADR 0007). No API key.
  "google-genai>=1.75,<2",
  # Signed upload URLs and reading uploaded resumes from Cloud Storage (ADR 0010). Files never transit the API.
  "google-cloud-storage>=3,<4",
  # Reads .docx resumes to text; PDFs go to the model natively instead (ADR 0010).
  "python-docx>=1.1,<2",
  # Cloud SQL connector: IAM-authenticated, TLS connections with no database password (ADR 0011).
  "cloud-sql-python-connector[psycopg]>=1.15,<2",
  # PostgreSQL driver.
  "psycopg[binary]>=3.2,<4",
  # Used only as the connection pool around the connector and to run text() SQL. No ORM (ADR 0011).
  "sqlalchemy>=2.0,<3",
  # Fetches a job posting from a link the user pastes (ADR 0026). Already here for tests; promoted because
  # it can connect to an address we checked while keeping the real hostname for TLS (`sni_hostname`).
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  # Test runner.
  "pytest>=8",
  # (httpx, which FastAPI's TestClient needs, is a runtime dependency above.)
  # Lint + format in one tool, replaces flake8/isort/black.
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pyflakes + pycodestyle basics, I = import order, UP = modern-syntax nudges, B = common bugs.
select = ["E", "F", "I", "UP", "B"]
